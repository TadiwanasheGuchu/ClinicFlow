[project]
name = "clinicflow-backend"
version = "0.1.0"
description = "ClinicFlow API — healthcare practice management platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "cryptography>=43",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "RUF059", "E501"]
# Role name comes from trusted settings, not user input.
"migrations/**" = ["E501", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
